<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>Simon Says Game</h1>
    <h2>Press start button to begin.</h2>
    <button class="start-btn">Start Game</button>
    <div class="outer">
        <div class="line-one">
            <div class="pink btn" id="pink"></div>
            <div class="orange btn" id="orange"></div>
        </div>
        <div class="line-two">
            <div class="teal btn" id="teal"></div>
            <div class="blue btn" id="blue"></div>
        </div>
    </div>

    <section class="score-board">
        <h3 class="score">
            <span>Current Score: </span><br />
            <span id="current">0</span>
        </h3>
        <h3 class="score">
            <span>Highest Score: </span><br />
            <span id="hScore">0</span>
        </h3>
    </section>

    <script src="app.js"></script>
</body>

</html>
